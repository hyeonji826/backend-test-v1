spring:
  datasource:
    url: jdbc:mariadb://localhost:3306/appdb
    username: appuser
    password: app-pass
    driver-class-name: org.mariadb.jdbc.Driver

  jpa:
    hibernate:
      ddl-auto: none

  sql:
    init:
      mode: always
      schema-locations: file:sql/schema.sql
      data-locations: []

  flyway:
    enabled: false

pg:
  test:
    base-url: http://localhost:18080
    connect-timeout-ms: 2000
    read-timeout-ms: 3000
    api-key: dummy-key
server:
  error:
    include-message: always
    include-exception: true
  tomcat:
    accesslog:
      enabled: true
      directory: build/logs
      prefix: access
      suffix: .log
      buffered: true
      rename-on-rotate: true
      pattern: '%h %l %u %t "%r" %s %b %D'

management:
  endpoints:
    web:
      exposure:
        include: health

logging:
  file:
    name: build/logs/spring.log
  level:
    im.bigs.pg: DEBUG

