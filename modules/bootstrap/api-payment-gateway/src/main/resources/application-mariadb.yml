spring:
  datasource:
    url: jdbc:mariadb://localhost:3306/appdb
    username: root
    password: root
    driver-class-name: org.mariadb.jdbc.Driver

  jpa:
    hibernate:
      ddl-auto: none

  sql:
    init:
      mode: always
      schema-locations: classpath:schema.sql
      data-locations: []

  flyway:
    enabled: false
